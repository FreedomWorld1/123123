<!DOCTYPE html>
<html lang="de">

<head>
<meta charset="UTF-8">
<title>Medical Evaluation</title>

<style>

body{
background:#111;
color:white;
font-family:Arial;
}

.container{
width:90%;
margin:auto;
}

.title{
color:#3cff00;
background:#1b1b1b;
padding:15px;
font-size:26px;
text-align:center;
margin-top:20px;
}

.controls{
margin:15px 0;
display:flex;
justify-content:space-between;
}

input,button{
padding:8px;
background:#222;
color:white;
border:1px solid #444;
}

button:hover{
background:#333;
cursor:pointer;
}

table{
width:100%;
border-collapse:collapse;
}

th{
background:#1f3b1f;
padding:10px;
border:1px solid #333;
}

td{
border:1px solid #333;
padding:8px;
background:#1a1a1a;
text-align:center;
}

.name{
background:#2b2b2b;
text-align:left;
}

.linkInput{
width:90%;
background:#222;
border:none;
color:#2d8cff;
}

a{
color:#2d8cff;
}

</style>
</head>

<body>

<div class="container">

<div class="title">
MEDICAL & PSYCHOLOGICAL EVALUATION
</div>

<div class="controls">

<div>
<input id="newPatient" placeholder="Neuer Patient">
<button onclick="addPatient()">Hinzufügen</button>
</div>

<div>
Suche:
<input id="search" placeholder="Name suchen">
</div>

</div>

<table id="table">

<thead>
<tr>
<th>Patient</th>
<th>Docx</th>
<th>Docx</th>
<th>Docx</th>
<th>Docx</th>
<th>Docx</th>
</tr>
</thead>

<tbody>

</tbody>

</table>

</div>

<script>

let patients = JSON.parse(localStorage.getItem("patients")) || [

{ name:"Percy Wright", docs:["","","","",""] },
{ name:"Kevin Walker", docs:["","","","",""] },
{ name:"Michael Bortega", docs:["","","","",""] }

];

function save(){
localStorage.setItem("patients",JSON.stringify(patients));
}

function render(){

let tbody=document.querySelector("#table tbody");
tbody.innerHTML="";

patients.forEach((p,i)=>{

let row=document.createElement("tr");

let name=document.createElement("td");
name.className="name";
name.innerText=p.name;

row.appendChild(name);

p.docs.forEach((link,j)=>{

let td=document.createElement("td");

let input=document.createElement("input");
input.value=link;
input.className="linkInput";

input.onchange=()=>{
patients[i].docs[j]=input.value;
save();
}

td.appendChild(input);

if(link){
let open=document.createElement("div");
open.innerHTML=`<a href="${link}" target="_blank">OPEN</a>`;
td.appendChild(open);
}

row.appendChild(td);

});

tbody.appendChild(row);

});

}

function addPatient(){

let name=document.getElementById("newPatient").value;

if(name==="")return;

patients.push({
name:name,
docs:["","","","",""]
});

save();
render();

document.getElementById("newPatient").value="";
}

document.getElementById("search").addEventListener("keyup",function(){

let value=this.value.toLowerCase();
let rows=document.querySelectorAll("#table tbody tr");

rows.forEach(row=>{

let name=row.querySelector(".name").innerText.toLowerCase();

row.style.display=name.includes(value)?"":"none";

});

});

render();

</script>

</body>
</html>
